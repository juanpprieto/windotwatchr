name: Deploy Examples
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:examples
      - run: bun --bun run playwright install --with-deps chromium
      - run: bun run test:e2e -- --reporter=line --workers=2
      - name: Assemble site
        run: |
          mkdir -p _site/nextjs _site/vite-react
          cp -r examples/nextjs/out/* _site/nextjs/
          cp -r examples/vite-react/dist/* _site/vite-react/
          cat > _site/index.html << 'LANDING'
          <!DOCTYPE html>
          <html><head><title>windotwatchr demos</title></head>
          <body>
            <h1>windotwatchr demos</h1>
            <ul>
              <li><a href="nextjs/">Next.js showcase</a></li>
              <li><a href="vite-react/">Vite + React showcase</a></li>
            </ul>
          </body></html>
          LANDING
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
